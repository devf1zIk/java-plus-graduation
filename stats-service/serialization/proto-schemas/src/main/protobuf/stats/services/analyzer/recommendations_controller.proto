syntax = "proto3";

package stats.service.dashboard;

option java_multiple_files = true;
option java_package = "ru.yandex.practicum.stats.proto";

import "stats/messages/user_predictions_request.proto";
import "stats/messages/recommended_event.proto";
import "stats/messages/similar_event_request.proto";
import "stats/messages/interactions_count_request.proto";

service RecommendationsController {

  rpc GetRecommendationsForUser (message.action.UserPredictionsRequestProto)
      returns (stream message.action.RecommendedEventProto);

  rpc GetSimilarEvents (message.action.SimilarEventsRequestProto)
      returns (stream message.action.RecommendedEventProto);

  rpc GetInteractionsCount (message.action.InteractionsCountRequestProto)
      returns (stream message.action.RecommendedEventProto);
}