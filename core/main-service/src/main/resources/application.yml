spring:
  profiles:
    active: dev
  application:
    name: main-service
  config:
    import: "configserver:"
  cloud:
    config:
      override-none: true
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true