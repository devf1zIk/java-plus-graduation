server:
  port: 0
spring:
  application:
    name: user-service
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ewm-main
    username: postgres
    password: password

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
      user-service:
        connectTimeout: 5000
        readTimeout: 5000
      request-service:
        connectTimeout: 5000
        readTimeout: 5000
logging:
  level:
    root: INFO
    ru.yandex.practicum.explorewithme.user: DEBUG
    "org.springframework.orm.jpa": INFO
    "org.springframework.transaction": INFO
    "org.hibernate.SQL": DEBUG