server:
  port: 8080
spring:
  cloud:
    gateway:
      discovery.locator.enabled: true
      routes:
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/**
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/**
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/**
management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: gateway
logging:
  level:
    org:
      springframework:
        cloud:
          gateway: DEBUG