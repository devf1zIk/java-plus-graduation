server:
  port: 8080
spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: event-service
          uri: lb://EVENT-SERVICE
          predicates:
            - Path=/events/**,/categories/**,/compilations/**,/admin/events/**,/admin/categories/**,/admin/compilations/**,/users/{userId}/events/**,/internal/events/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/admin/users/**,/internal/users/**

        - id: request-service
          uri: lb://REQUEST-SERVICE
          predicates:
            - Path=/users/{userId}/requests/**,/users/{userId}/events/{eventId}/requests/**,/internal/requests/**
        - id: comment-service
          uri: lb://COMMENT-SERVICE
          predicates:
            - Path=/users/{userId}/comments/**,/events/{eventId}/comments/**,/comments/{commentId}
        - id: stats-service
          uri: lb://STATS-SERVER
          predicates:
            - Path=/hits,/stats/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG